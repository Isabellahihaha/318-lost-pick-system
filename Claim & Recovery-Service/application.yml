server:
  port: 8084

spring:
  application:
    name: claim-recovery-service

  datasource:
    url: jdbc:postgresql://localhost:5432/claim_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true