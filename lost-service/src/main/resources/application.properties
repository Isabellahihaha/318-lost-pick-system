server.port=8081
spring.application.name=lost-service

spring.datasource.url=jdbc:sqlite:lostservice.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173

found.service.url=http://localhost:8082
matching.service.url=http://localhost:8085

spring.cloud.stream.bindings.lostItemReported-out-0.destination=lost-item-reported
spring.cloud.stream.bindings.lostItemReported-out-0.content-type=application/json
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.auto-create-topics=true
spring.cloud.stream.kafka.binder.producer-properties.max.block.ms=3000
