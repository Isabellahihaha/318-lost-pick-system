server:
  port: 8081

spring:
  application:
    name: lost-service
  datasource:
    url: jdbc:h2:mem:lostdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # ─── Apache Kafka Configuration ─────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: lost-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.csci318.*"
    listener:
      missing-topics-fatal: false

# ─── Kafka Topics ────────────────────────────────────────────────────────────
kafka:
  topics:
    lost-item-reported: lost-item-reported
    potential-match-found: potential-match-found
    claim-submitted: claim-submitted
    item-recovered: item-recovered

# ─── LangChain4j / Google Gemini Configuration ───────────────────────────────
langchain4j:
  google-ai-gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key-here}
    model-name: gemini-2.0-flash
    temperature: 0.3
    max-output-tokens: 1024
    log-requests: true
    log-responses: true

logging:
  level:
    com.csci318.lost: DEBUG
    org.springframework.kafka: INFO
    dev.langchain4j: DEBUG
