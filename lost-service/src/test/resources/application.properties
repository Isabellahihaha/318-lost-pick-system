# ─── Test profile overrides for lost-service ─────────────────────────────────
# Use embedded H2 (already default) and disable Kafka broker requirement for tests

# Point Kafka to the embedded broker provided by spring-kafka-test
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}

# Disable Gemini auto-config in tests (no real API key needed)
langchain4j.google-ai-gemini.api-key=test-key
langchain4j.google-ai-gemini.log-requests=false
langchain4j.google-ai-gemini.log-responses=false

# Suppress JPA DDL warnings in tests
spring.jpa.show-sql=false
